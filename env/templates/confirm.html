{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Confirmed — {{ table }} #{{ mutation.id }}</h2>
  {% if joined %}
  <table>
    {% for k, v in joined.items() %}
    <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
    {% endfor %}
  </table>
  {% endif %}
  <table style="margin-top:8px">
    {% for k, v in mutation.items() if k not in ("id", "created_at") %}
    <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
