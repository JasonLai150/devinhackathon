{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ row[title_field] if title_field else entity ~ " #" ~ row.id }}</h2>
  <table>
    {% for k, v in row.items() if k != "id" %}
    <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
    {% endfor %}
  </table>
  {% if form_fields %}
  <form method="post" action="{{ action }}" style="margin-top:16px">
    {% for f in form_fields %}
    <input type="{{ f.type | default('text') }}" name="{{ f.name }}"
           placeholder="{{ f.label }}"{% if f.required %} required{% endif %}>
    {% endfor %}
    <button type="submit">{{ labels.book_button }}</button>
  </form>
  {% endif %}
</div>
<p><a href="">← Back to results</a></p>
{% endblock %}
