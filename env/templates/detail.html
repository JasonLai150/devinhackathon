{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ row[title_field] if title_field else entity ~ " #" ~ row.id }}</h2>
  <table>
    {% for k, v in row.items() if k != "id" %}
    <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
    {% endfor %}
  </table>
  <form method="post" action="{{ action }}" style="margin-top:16px">
    {% for f in form_fields %}
    <input type="{{ f.type | default('text') }}" name="{{ f.name }}"
           aria-label="{{ f.label }}" placeholder="{{ f.label }}"
           {% if f.default is defined %}value="{{ f.default }}"{% endif %}
           {% if f.min is defined %}min="{{ f.min }}"{% endif %}
           {% if f.required %}required{% endif %}>
    {% endfor %}
    <button type="submit"{% if action_test %} data-test="{{ action_test }}"{% endif %}>{{ labels.book_button }}</button>
  </form>
</div>
<p><a href="{{ entry_url }}">← Back to results</a></p>
{% endblock %}
