  <div style="background:#fff; border-radius:10px; padding:28px; width:340px;
              text-align:center;">
    <h3 style="margin-top:0">Get 10% off your first flight</h3>
    <p class="muted">Join our mailing list for exclusive deals.</p>
    <form style="display:flex; gap:8px; justify-content:center; margin-bottom:14px">
      <input type="email" placeholder="Email" style="flex:1">
      <button type="button">Sign up</button>
    </form>
    <a href="#" onclick="document.getElementById('overlay').remove(); return false;"
       style="color:#5b6472; font-size:13px">No thanks, continue to results</a>

</div>
